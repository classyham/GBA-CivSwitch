name: Release Moonlight

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate new release version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/release_ci.py prepare
          --kind moonlight
          --repository "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build
      - name: Bootstrap pinned toolchain and sources
        run: npm run bootstrap
      - name: Build streaming runtime
        run: npm run build
      - name: Build versioned app with update declaration
        run: python3 -B tools/release_ci.py build
      - name: Host checks
        run: |
          npm test
          npm run test:release
      - name: Generated runtime checks
        run: npm run test:runtime
      - name: Inspect package
        run: python3 -B tools/package_payload.py --inspect dist/gba.civapp
      - name: Package and browser lifetime checks
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: npm run test:package -- "$RELEASE_VERSION"
      - name: Browser navigation checks
        run: npm run test:ui
      - name: Retain validated workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: moonlight-${{ steps.plan.outputs.tag }}
          if-no-files-found: error
          path: |
            dist/gba.civapp
            dist/SHA256SUMS
            tools/package_payload.py
      - name: Publish complete verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/release_ci.py publish
